<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Offers | A-to-Z eBook Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f7f8fa;
      margin: 0;
      padding: 0;
      color: #222;
    }
    header {
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      position: sticky; top: 0; z-index: 100;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1200px; margin: auto; padding: 0.7rem 1rem;
    }
    .logo { font-size: 2rem; color: #1150a3; font-weight: bold; text-decoration: none; }
    .nav-links a { margin-left: 1.2rem; color: #222; text-decoration: none; font-weight: 500; font-size: 1rem; }
    .nav-links a.active, .nav-links a:hover { color: #1150a3; }
    /* Hero Banner */
    .offer-hero {
      background: linear-gradient(90deg, #1150a3 60%, #d32f2f 100%);
      color: #fff;
      text-align: center;
      padding: 3.2rem 1.2rem 2.7rem 1.2rem;
      position: relative;
    }
    .offer-hero h1 {
      font-size: 2.3rem; font-weight: 700; margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }
    .offer-hero p { font-size: 1.25rem; margin-bottom: 1.3rem; }
    .countdown {
      display: inline-block; background: rgba(255,255,255,0.15); padding: 0.7em 1.7em; border-radius: 2em; font-size: 1.14rem; font-weight: 500;
    }
    .offer-badge {
      display: inline-block; background: #fff; color: #d32f2f;
      border-radius: 8px; padding: 0.35em 1.2em; font-size: 1.05rem;
      font-weight: bold; margin-top: 1.1rem; box-shadow: 0 2px 8px rgba(17,80,163,.12);
    }
    /* Offers Grid */
    .main-content { max-width: 1200px; margin: 2.3rem auto; }
    .offers-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.1rem; }
    .offers-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap: 1.5rem;
    }
    .offer-card {
      background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 1.2rem 1rem 1.5rem 1rem; text-align: center;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.17s, box-shadow 0.17s;
    }
    .offer-card:hover {
      transform: translateY(-7px) scale(1.04);
      box-shadow: 0 6px 32px rgba(211,47,47,0.14);
      z-index: 2;
    }
    .offer-card img {
      width: 120px; height: 170px; object-fit: cover; border-radius: 8px;
      margin-bottom: 0.9rem; box-shadow: 0 2px 12px rgba(17,80,163,.1);
    }
    .offer-card .product-title { font-weight: 600; font-size: 1.13rem; min-height: 2.0em; margin-bottom: 0.35rem; }
    .offer-card .product-author { color: #666; font-size: 0.98rem; margin-bottom: 0.55rem; }
    .old-price {
      color: #888; font-size: 1.05rem; text-decoration: line-through; margin-bottom: 0.1rem;
    }
    .offer-price {
      color: #d32f2f; font-size: 1.28rem; font-weight: 700; margin-bottom: 0.5rem;
    }
    .offer-card .offer-savings {
      background: #1150a3; color: #fff; border-radius: 1em;
      padding: 0.2em 0.95em; font-size: 0.95rem; margin-bottom: 0.8em;
      display: inline-block; font-weight: 500;
    }
    .offer-card button {
      background: #1150a3; color: #fff; border: none; border-radius: 20px;
      padding: 0.57rem 1.7rem; font-weight: 600; cursor: pointer;
      transition: background 0.16s; font-size: 1.07rem;
      margin-top: auto;
    }
    .offer-card button:hover { background: #d32f2f; }
    /* Responsive */
    @media (max-width: 900px) { .main-content, .top-bar { padding-left: 1rem; padding-right: 1rem; } }
    @media (max-width: 700px) { .offers-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 500px) { .offers-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <div class="top-bar">
    <a class="logo" href="#">A-to-Z</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="#">Categories</a>
      <a href="#">Bestsellers</a>
      <a href="#" class="active">Offers</a>
      <a href="login.html">Login/Signup</a>
    </div>
  </div>
</header>

<div class="offer-hero">
  <h1>🔥 Flash Deals & Exclusive Offers!</h1>
  <p>Grab your favorite eBooks at unbeatable prices. Limited time only!</p>
  <div class="countdown" id="countdown">Ends in: --:--:--:--</div>
  <div class="offer-badge"><i class="fas fa-gift"></i> Extra 15% OFF for first 50 orders!</div>
</div>

<main class="main-content">
  <div class="offers-title"><i class="fas fa-tags" style="color:#d32f2f"></i> Best Offers of the Month</div>
  <div class="offers-grid" id="offers-grid">
    <!-- Offer products will be generated by JS -->
  </div>
</main>

<script>
  // Flash Sale Countdown (ends in 2 days)
  function updateCountdown() {
    const end = new Date();
    end.setDate(end.getDate() + 2); // 2 days from now
    function pad(n) { return n < 10 ? '0'+n : n; }
    function tick() {
      const now = new Date();
      let diff = Math.max(0, end - now);
      let days = Math.floor(diff / (1000*60*60*24));
      let hours = Math.floor((diff / (1000*60*60)) % 24);
      let mins = Math.floor((diff / (1000*60)) % 60);
      let secs = Math.floor((diff / 1000) % 60);
      document.getElementById('countdown').innerText =
        `Ends in: ${pad(days)}d ${pad(hours)}h ${pad(mins)}m ${pad(secs)}s`;
      if (diff > 0) setTimeout(tick, 1000);
    }
    tick();
  }
  updateCountdown();

  // Dummy offer products
  const offers = [
    {
      title: "Atomic Habits",
      author: "James Clear",
      image: "https://covers.openlibrary.org/b/id/11153290-L.jpg",
      oldPrice: 550, newPrice: 345, savings: "38% OFF"
    },
    {
      title: "The Great Gatsby",
      author: "F. Scott Fitzgerald",
      image: "https://covers.openlibrary.org/b/id/10594783-L.jpg",
      oldPrice: 400, newPrice: 235, savings: "41% OFF"
    },
    {
      title: "Harry Potter",
      author: "J.K. Rowling",
      image: "https://covers.openlibrary.org/b/id/10958378-L.jpg",
      oldPrice: 600, newPrice: 410, savings: "32% OFF"
    },
    {
      title: "Sapiens",
      author: "Yuval Noah Harari",
      image: "https://covers.openlibrary.org/b/id/10594679-L.jpg",
      oldPrice: 750, newPrice: 479, savings: "36% OFF"
    },
    {
      title: "The Alchemist",
      author: "Paulo Coelho",
      image: "https://covers.openlibrary.org/b/id/10709119-L.jpg",
      oldPrice: 390, newPrice: 260, savings: "33% OFF"
    },
    {
      title: "Man's Search For Meaning",
      author: "Viktor Frankl",
      image: "https://covers.openlibrary.org/b/id/10594680-L.jpg",
      oldPrice: 690, newPrice: 420, savings: "39% OFF"
    },
    {
      title: "Deep Work",
      author: "Cal Newport",
      image: "https://covers.openlibrary.org/b/id/10594891-L.jpg",
      oldPrice: 510, newPrice: 345, savings: "32% OFF"
    },
    {
      title: "To Kill a Mockingbird",
      author: "Harper Lee",
      image: "https://covers.openlibrary.org/b/id/8225267-L.jpg",
      oldPrice: 460, newPrice: 299, savings: "35% OFF"
    },
    {
      title: "Rich Dad Poor Dad",
      author: "Robert Kiyosaki",
      image: "https://covers.openlibrary.org/b/id/11032768-L.jpg",
      oldPrice: 480, newPrice: 315, savings: "34% OFF"
    }
  ];

  const offersGrid = document.getElementById('offers-grid');
  offers.forEach(offer => {
    offersGrid.innerHTML += `
      <div class="offer-card">
        <img src="${offer.image}" alt="Book Cover">
        <div class="product-title">${offer.title}</div>
        <div class="product-author">${offer.author}</div>
        <div class="old-price">৳ ${offer.oldPrice}</div>
        <div class="offer-price">৳ ${offer.newPrice}</div>
        <div class="offer-savings">${offer.savings}</div>
        <button><i class="fas fa-cart-plus"></i> Get Offer</button>
      </div>
    `;
  });
</script>
</body>
</html>
