                        document.getElementById('etds-main-app-body-start').style.display = "block";
                        // $("#my-modal").modal("show");
                        var el = document.getElementById('contents');
                        if (el) {
                            el.style.visibility = "visible";
                        }

                    }, 3000);

                    // modal active for 10sec
                    // setTimeout(() => {
                    //     $("#my-modal").modal("hide");
                    // }, 20000);
                }
            }
        </script>

        <script>
            gsap.set("#slider", {
                transformOrigin: "center",
            });
            gsap.set("#left-e, #left-t, #left-d, #left-s", {
                fill: "#ffffff",
                visibility: "hidden",
            });
            gsap.set("#text-content", {
                transformOrigin: "center",
                scale: 1.4,
            });
            gsap.set("#shimmer-img-2", {
                x: -100,
                y: -50,
            });
            gsap.set("#shimmer-img", {
                x: 0,
            });
            gsap.set("#subtext-rect", {
                y: 10,
                width: "100%"
            });
            gsap.set(".stg-1-item, .stg-2-item, .stg-3-item, .stg-4-item, .stg-5-item", {
                opacity: 0,
            })


            const revealDuration = 0.4;
            const revealItem = (id, fillColor = "#636464") => {
                gsap.set(id, {
                    visibility: "visible",
                });
                gsap.to(id, {
                    fill: fillColor,
                    duration: 0.5,
                    delay: revealDuration - 0.3,
                });
            };
            const revealEnvironment = () => {
                gsap.to(".environment", {
                    visibility: "visible",
                    stagger: 0.081,
                });
            };
            const revealSubtext = () => {
                const tl = new gsap.timeline();
                tl.add("one");
                tl.to(".stg-1-item", {
                    opacity: 1,
                    stagger: 0.1,
                    onStart: () => {
                        gsap.fromTo("#stg-1", {
                            x: 80
                        }, {
                            x: 0,
                            delay: 0.3
                        })
                    }
                }, "one")
                tl.to(".stg-2-item", {
                    opacity: 1,
                    stagger: 0.1,
                    onStart: () => {
                        gsap.fromTo("#stg-2", {
                            x: 45
                        }, {
                            x: 0,
                            delay: 0.1
                        })
                    }
                }, "one+=0.2")
                tl.to(".stg-3-item", {
                    opacity: 1,
                    stagger: 0.05,
                    onStart: () => {
                        gsap.fromTo("#stg-3", {
                            x: 10
                        }, {
                            x: 0,
                            delay: 0.1
                        })
                    }
                }, "one+=0.3")
                tl.to(".stg-4-item", {
                    opacity: 1,
                    stagger: 0.05,
                    onStart: () => {
                        gsap.fromTo("#stg-4", {
                            x: -10
                        }, {
                            x: 0,
                            delay: 0.1
                        })
                    }
                }, "one+=0.4")
                tl.to(".stg-5-item", {
                    opacity: 1,
                    stagger: 0.05,
                    onStart: () => {
                        gsap.fromTo("#stg-5", {
                            x: -20
                        }, {
                            x: 0
                        })
                    }
                }, "one+=0.5")
                return tl;
            };

            const moveSlider = () => {
                const tl = new gsap.timeline();
                tl.to(
                    "#slider", {
                        x: 35,
                        rotateZ: 90 * 2,
                        onsStart: () => revealItem("#left-e"),
                        duration: revealDuration,
                    },
                    0
                );
                tl.to("#slider", {
                    x: 80,
                    rotateZ: 180 * 2,
                    onsStart: () => revealItem("#left-t", "#646565"),
                    duration: revealDuration,
                });
                tl.to("#slider", {
                    x: 130,
                    rotateZ: 270 * 2,
                    onsStart: () => revealItem("#left-d", "#646565"),
                    duration: revealDuration,
                });
                tl.to("#slider", {
                    x: 200,
                    rotateZ: 360 * 2,
                    onsStart: () => revealItem("#left-s"),
                    duration: revealDuration,
                });
                tl.add("bp1");
                tl.to("#slider", {
                    x: 610,
                    duration: 0.075 * 14.2,
                    onStart: revealEnvironment,
                    ease: "sine.out"
                }, "bp1");
                tl.to("#slider", {
                    width: "3",
                    x: 647
                }, "bp1+=1");
                tl.add("bp3");
                tl.to("#slider", {
                    x: 180
                }, "bp3");
                tl.to("#text-content", {
                    scale: 1.2
                }, "bp3");
                tl.set("#slider", {
                    rotateZ: 0
                });
                tl.to("#slider", {
                    transformOrigin: "center",
                    rotateZ: -15
                });
                tl.add("bp2");
                tl.set("#slider", {
                    opacity: 0
                }, "bp2");
                tl.set("#middle-line", {
                    opacity: 1
                }, "bp2");
                tl.to(
                    "#upper-line", {
                        strokeDashoffset: 400,
                        opacity: 1,
                    },
                    "bp2"
                );
                tl.to(
                    "#lower-line", {
                        strokeDashoffset: 0,
                        opacity: 1,
                    },
                    "bp2"
                );
                tl.add(revealSubtext);
                tl.add("bp6");
                tl.to(
                    "#svg-content", {
                        transformOrigin: "center",
                        scale: 0.8,
                        ease: "expo.out",
                        delay: 1
                    },
                    "bp6"
                );
                tl.add("bp7")
                tl.to("#shimmer-img-2", {
                    x: 300,
                    duration: 1,
                }, "bp7");
                tl.to("#shimmer-img", {
                    x: 600,
                    duration: 1,
                }, "bp7+=0.2");
                return tl;
            };

            const majorTl = new gsap.timeline({
                delay: 0.2
            });
            majorTl.add(moveSlider);
        </script>
